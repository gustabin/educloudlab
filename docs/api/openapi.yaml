openapi: 3.1.0
info:
  title: EduCloud Lab API
  version: 0.1.0
  description: |
    Versioned REST API of EduCloud Lab. All responses use the standard envelope.

    Authentication (ADR-003):
    - Browser: server-side session cookie `ecsid` (HttpOnly, SameSite=Lax). Every POST/PUT/PATCH/DELETE needs
      the `X-CSRF-Token` header (from `<meta name="csrf-token">`); anonymous forms use a token bound to the
      `ec_csrf` cookie. Requests with a Bearer token never use cookies and need no CSRF token.
    - API clients: `POST /auth/tokens` returns a 15-minute HS256 access token plus a rotating refresh token.
servers:
  - url: http://localhost/educloudlab/api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness/readiness probe (no versions or internals exposed)
      tags: [system]
      security: []
      responses:
        '200':
          description: Service and database reachable
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status, checks]
                        properties:
                          status: { type: string, const: ok }
                          checks:
                            type: object
                            properties:
                              database: { type: string, enum: [ok] }
        '503':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
  /auth/register:
    post:
      operationId: register
      summary: Create an account (always answers 202 to prevent account enumeration)
      tags: [auth]
      security: [{csrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, display_name]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 12, maxLength: 128 }
                display_name: { type: string, minLength: 2, maxLength: 100 }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Confirm an email address with the emailed one-time token AND the account password
      description: A wrong password returns 422 (field password) and does not consume the token.
      tags: [auth]
      security: [{csrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string, maxLength: 128 }
                password: { type: string, maxLength: 1024 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/verify-email/resend:
    post:
      operationId: resendVerification
      summary: Send a new verification link (always 202)
      tags: [auth]
      security: [{csrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      operationId: login
      summary: Browser login; sets the session cookie and returns a session-bound CSRF token
      description: 401 INVALID_CREDENTIALS covers unknown account, wrong password and temporary lockout. 403 EMAIL_NOT_VERIFIED / ACCOUNT_DISABLED only after a correct password.
      tags: [auth]
      security: [{csrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Logged in (Set-Cookie ecsid)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: '#/components/schemas/User' }
                          csrf_token: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logout
      summary: End the current browser session
      tags: [auth]
      security: [{sessionCookie: [], csrfToken: []}]
      responses:
        '204': { description: Logged out (session cookie cleared) }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /auth/me:
    get:
      operationId: me
      summary: Current user, active tenant and memberships
      tags: [auth]
      security: [{sessionCookie: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Current identity
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: '#/components/schemas/User' }
                          auth_method: { type: string, enum: [session, jwt] }
                          tenant: { $ref: '#/components/schemas/TenantMembership' }
                          memberships: { type: array, items: { $ref: '#/components/schemas/TenantMembership' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Email a password-reset link (always 202)
      tags: [auth]
      security: [{csrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/password/reset:
    post:
      operationId: resetPassword
      summary: Set a new password with a reset token; revokes all sessions and refresh tokens
      tags: [auth]
      security: [{csrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string, maxLength: 128 }
                password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/tokens:
    post:
      operationId: issueTokens
      summary: Exchange credentials for an access + refresh token pair (API clients; no cookies, no CSRF)
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201': { $ref: '#/components/responses/TokenPair' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/tokens/refresh:
    post:
      operationId: refreshTokens
      summary: Rotate a refresh token; reusing an old one revokes the whole token family
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200': { $ref: '#/components/responses/TokenPair' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/tokens/revoke:
    post:
      operationId: revokeTokens
      summary: Revoke a refresh token family (always 204)
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Revoked (or unknown token) }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /tenants:
    get:
      operationId: listTenants
      summary: Organizations (tenants) the caller belongs to; `active` marks the session/token tenant
      tags: [tenants]
      security: [{sessionCookie: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Memberships
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Tenant' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/switch:
    post:
      operationId: switchTenant
      summary: Make another organization the active tenant of the browser session (404 if not a member)
      tags: [tenants]
      security: [{sessionCookie: [], csrfToken: []}]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200':
          description: Active tenant changed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /workspaces:
    get:
      operationId: listWorkspaces
      summary: Workspaces visible in the active tenant (own; whole tenant for org_admin)
      tags: [workspaces]
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: q, in: query, description: Name contains (literal match), schema: { type: string, maxLength: 80 } }
        - { name: sort, in: query, schema: { type: string, enum: [name, created_at, updated_at], default: created_at } }
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: Page of workspaces (meta has page, per_page, total, total_pages)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Workspace' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: createWorkspace
      summary: Create a workspace owned by the caller in the active tenant (tenant is never taken from the body)
      tags: [workspaces]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /workspaces/{workspace_id}:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: getWorkspace
      summary: Workspace details (404 when it does not exist or is not visible)
      tags: [workspaces]
      security: [{sessionCookie: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Workspace
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateWorkspace
      summary: Rename or change the description (owner or org_admin)
      tags: [workspaces]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                description: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteWorkspace
      summary: Delete the workspace and all its resources (soft delete; owner or org_admin)
      tags: [workspaces]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /workspaces/{workspace_id}/resources:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: listResources
      summary: Non-deleted resources of a workspace
      tags: [resources]
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ResourceType' } }
      responses:
        '200':
          description: Resources
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Resource' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: createResource
      summary: Create a storage account or lakehouse (simulated provisioning → active)
      description: Other types (dataset, pipeline, notebook, dashboard) are created by their own modules and return 422 here.
      tags: [resources]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, name]
              properties:
                type: { $ref: '#/components/schemas/ResourceType' }
                name: { type: string, minLength: 2, maxLength: 80 }
                region: { type: string, enum: [edu-local-1, edu-local-2], default: edu-local-1 }
                config: { $ref: '#/components/schemas/ResourceConfig' }
                tags: { $ref: '#/components/schemas/Tags' }
      responses:
        '201':
          description: Created (status active)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Resource' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /resources/{resource_id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: getResource
      summary: Resource details (404 when not visible)
      tags: [resources]
      security: [{sessionCookie: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Resource
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Resource' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateResource
      summary: Rename, change config (partial, allowlisted keys) or replace tags; only active resources
      tags: [resources]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                config: { $ref: '#/components/schemas/ResourceConfig' }
                tags: { $ref: '#/components/schemas/Tags' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Resource' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteResource
      summary: Delete through the lifecycle (active|failed → deleting → deleted)
      tags: [resources]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
components:
  parameters:
    TenantId: { name: tenant_id, in: path, required: true, schema: { type: string, description: ULID } }
    WorkspaceId: { name: workspace_id, in: path, required: true, schema: { type: string, description: ULID } }
    ResourceId: { name: resource_id, in: path, required: true, schema: { type: string, description: ULID } }
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: ecsid }
    csrfToken: { type: apiKey, in: header, name: X-CSRF-Token }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Tenant:
      type: object
      properties:
        id: { type: string, description: ULID }
        name: { type: string }
        type: { type: string, enum: [personal, organization] }
        role: { type: string, enum: [org_admin, instructor, student, read_only] }
        active: { type: boolean }
    WorkspaceInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 80, pattern: '^[\\p{L}\\p{N}][\\p{L}\\p{N} ._-]*$' }
        description: { type: string, maxLength: 500 }
    Workspace:
      type: object
      properties:
        id: { type: string, description: ULID }
        name: { type: string }
        description: { type: [string, 'null'] }
        purpose: { type: string, enum: [general, lab] }
        status: { type: string, enum: [active, deleting, deleted] }
        owner: { type: object, properties: { id: { type: string }, display_name: { type: string } } }
        resource_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ResourceType:
      type: string
      enum: [storage, lakehouse, dataset, pipeline, notebook, dashboard]
    ResourceConfig:
      type: object
      description: |
        Allowlisted per type. storage: access_tier (hot|cool|archive), versioning (bool), redundancy (lrs|zrs).
        lakehouse: default_layer (bronze|silver|gold). Unknown keys → 422.
    Tags:
      type: object
      maxProperties: 10
      propertyNames: { pattern: '^[a-z0-9_-]{1,32}$' }
      additionalProperties: { type: string, maxLength: 64 }
    Resource:
      type: object
      properties:
        id: { type: string, description: ULID }
        workspace_id: { type: string }
        type: { $ref: '#/components/schemas/ResourceType' }
        name: { type: string }
        status: { type: string, enum: [provisioning, active, failed, deleting, deleted] }
        region: { type: string }
        config: { $ref: '#/components/schemas/ResourceConfig' }
        tags: { $ref: '#/components/schemas/Tags' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, maxLength: 1024 }
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, maxLength: 128 }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: { type: string, maxLength: 128 }
    User:
      type: object
      properties:
        id: { type: string, description: ULID }
        email: { type: string }
        display_name: { type: string }
        is_platform_admin: { type: boolean }
        locale: { type: string }
    TenantMembership:
      type: object
      properties:
        id: { type: string, description: Tenant ULID (active tenant) }
        tenant_id: { type: string, description: Tenant ULID (memberships list) }
        name: { type: string }
        type: { type: string, enum: [personal, organization] }
        role: { type: string, enum: [org_admin, instructor, student, read_only] }
    Meta:
      type: object
      properties:
        request_id: { type: string, pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: {}
        message: { type: string }
        meta: { $ref: '#/components/schemas/Meta' }
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED, CONFLICT,
                     QUOTA_EXCEEDED, PAYLOAD_TOO_LARGE, RATE_LIMITED, SERVICE_UNAVAILABLE, INTERNAL_ERROR,
                     CSRF_INVALID, INVALID_CREDENTIALS, EMAIL_NOT_VERIFIED, ACCOUNT_DISABLED, TOKEN_INVALID,
                     INVALID_STATE]
            message: { type: string }
            details:
              type: array
              items:
                type: object
                required: [code, message]
                properties:
                  field: { type: string }
                  code: { type: string }
                  message: { type: string }
        meta: { $ref: '#/components/schemas/Meta' }
  responses:
    Ok:
      description: Success envelope with a message
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    Accepted:
      description: Accepted; the same generic message is returned whether or not the account exists
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    TokenPair:
      description: Access and refresh tokens
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      token_type: { type: string, const: Bearer }
                      access_token: { type: string }
                      expires_in: { type: integer }
                      refresh_token: { type: string }
                      refresh_expires_in: { type: integer }
    Error:
      description: Error envelope (never contains stack traces, SQL or paths)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
