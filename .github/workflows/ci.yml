# EduCloud Lab CI (M12). Every job calls the same scripts that are verified locally (ci/test.sh runs ci/run.sh
# in Docker), so the workflow and the local runs cannot drift. Third-party actions are pinned by commit SHA; the
# token is read-only. Public repository: pull requests from forks run with `pull_request` (read-only token, no
# secrets). Never switch to `pull_request_target`.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.php }}, ${{ matrix.db }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        php: [php81, php83]
        db: [mysql80, mariadb1011]
        include:
          - php: php81
            db: mariadb104   # development parity (XAMPP)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Lint, static analysis, migrations up/down/up, PHPUnit, pytest (in Docker)
        run: bash ci/test.sh ${{ matrix.php }} ${{ matrix.db }}

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: composer audit
        run: composer audit --locked --no-interaction
      - name: pip-audit (runner and notebook image requirements)
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          pip-audit --strict -r worker/requirements.txt
          pip-audit --strict -r worker/notebook/requirements.txt
      - name: npm audit (development tooling only)
        run: npm audit --omit=optional --audit-level=high

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      db:
        image: mariadb:10.11@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
        env:
          MARIADB_ROOT_PASSWORD: ci-root-throwaway
        ports: ['127.0.0.1:3306:3306']
    env:
      CI_DB_HOST: 127.0.0.1
      CI_DB_ROOT_PASSWORD: ci-root-throwaway
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Notebook sandbox suite + Playwright E2E (axe)
        run: bash ci/e2e.sh
