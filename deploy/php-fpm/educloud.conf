; EduCloud Lab PHP-FPM pool. Copy to /etc/php/8.3/fpm/pool.d/educloud.conf and reload php8.3-fpm.
[educloud]
user = educloud
group = educloud
listen = /run/php/php8.3-fpm-educloud.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
request_terminate_timeout = 120s

; The app never shows errors to clients; it logs them itself (JSON lines in STORAGE_PATH/logs).
php_admin_flag[display_errors] = off
php_admin_flag[expose_php] = off
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 24M
php_admin_value[max_execution_time] = 60
php_admin_value[session.use_strict_mode] = 1
; PHP may only touch the releases, the shared configuration (.env is a symlink into shared/) and the data directory.
; ci/smoke.sh runs the release smoke test with these same restrictions (gate M12-01).
php_admin_value[open_basedir] = /srv/educloud/current/:/srv/educloud/releases/:/srv/educloud/shared/:/srv/educloud/data/:/tmp/
; Workers are launched by systemd, never from web requests.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,popen,proc_open,proc_nice,pcntl_exec
; Only the variables the app needs; secrets come from .env, read by the app itself.
clear_env = yes
