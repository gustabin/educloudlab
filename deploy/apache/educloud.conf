# EduCloud Lab virtual host (Apache 2.4 + PHP-FPM). Copy to /etc/apache2/sites-available/educloud.conf,
# replace lab.example.edu, then: a2enmod proxy_fcgi setenvif rewrite headers ssl http2 && a2ensite educloud
# TLS certificates: certbot --apache -d lab.example.edu (it adds the SSL directives below this block).

<VirtualHost *:80>
    ServerName lab.example.edu
    # Everything goes to HTTPS (the app sends HSTS itself over HTTPS).
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName lab.example.edu
    Protocols h2 http/1.1

    # Only public/ is served. Releases live in /srv/educloud/releases/<version>; "current" is a symlink.
    DocumentRoot /srv/educloud/current/public
    <Directory /srv/educloud/current/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    # Defence in depth: nothing above public/ is reachable even if DocumentRoot is changed by mistake.
    <Directory /srv/educloud>
        Require all denied
    </Directory>
    <Directory /srv/educloud/current/public>
        Require all granted
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm-educloud.sock|fcgi://localhost"
    </FilesMatch>
    # Bearer tokens (API clients, /metrics) must reach PHP-FPM.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    # Upload limit slightly above quotas.upload_max_bytes (20 MB); PHP enforces the exact value.
    LimitRequestBody 26214400

    # Optional: only let the monitoring server scrape /metrics (it also needs METRICS_TOKEN).
    # <Location "/metrics">
    #     Require ip 10.0.0.0/8
    # </Location>

    ErrorLog ${APACHE_LOG_DIR}/educloud-error.log
    CustomLog ${APACHE_LOG_DIR}/educloud-access.log combined
    ServerSignature Off

    # SSLEngine on / SSLCertificateFile / SSLCertificateKeyFile: added by certbot.
</VirtualHost>
