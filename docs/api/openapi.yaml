openapi: 3.1.0
info:
  title: EduCloud Lab API
  version: 0.7.0
  description: |
    Versioned REST API of EduCloud Lab. All responses use the standard envelope.

    Authentication (ADR-003):
    - Browser: server-side session cookie `ecsid` (HttpOnly, SameSite=Lax). Every POST/PUT/PATCH/DELETE needs
      the `X-CSRF-Token` header (from `<meta name="csrf-token">`); anonymous forms use a token bound to the
      `ec_csrf` cookie. Requests with a Bearer token never use cookies and need no CSRF token.
    - API clients: `POST /auth/tokens` returns a 15-minute HS256 access token plus a rotating refresh token.
servers:
  - url: http://localhost/educloudlab/api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness/readiness probe (no versions or internals exposed)
      tags: [system]
      security: []
      responses:
        '200':
          description: Service and database reachable
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status, checks]
                        properties:
                          status: { type: string, const: ok }
                          checks:
                            type: object
                            properties:
                              database: { type: string, enum: [ok] }
        '503':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
  /auth/register:
    post:
      operationId: register
      summary: Create an account (always answers 202 to prevent account enumeration)
      tags: [auth]
      security: [{csrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, display_name]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 12, maxLength: 128 }
                display_name: { type: string, minLength: 2, maxLength: 100 }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Confirm an email address with the emailed one-time token AND the account password
      description: A wrong password returns 422 (field password) and does not consume the token.
      tags: [auth]
      security: [{csrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string, maxLength: 128 }
                password: { type: string, maxLength: 1024 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/verify-email/resend:
    post:
      operationId: resendVerification
      summary: Send a new verification link (always 202)
      tags: [auth]
      security: [{csrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      operationId: login
      summary: Browser login; sets the session cookie and returns a session-bound CSRF token
      description: 401 INVALID_CREDENTIALS covers unknown account, wrong password and temporary lockout. 403 EMAIL_NOT_VERIFIED / ACCOUNT_DISABLED only after a correct password.
      tags: [auth]
      security: [{csrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Logged in (Set-Cookie ecsid)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: '#/components/schemas/User' }
                          csrf_token: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logout
      summary: End the current browser session
      tags: [auth]
      security: [{sessionCookie: [], csrfToken: []}]
      responses:
        '204': { description: Logged out (session cookie cleared) }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /auth/me:
    get:
      operationId: me
      summary: Current user, active tenant and memberships
      tags: [auth]
      security: [{sessionCookie: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Current identity
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: '#/components/schemas/User' }
                          auth_method: { type: string, enum: [session, jwt] }
                          tenant: { $ref: '#/components/schemas/TenantMembership' }
                          memberships: { type: array, items: { $ref: '#/components/schemas/TenantMembership' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Email a password-reset link (always 202)
      tags: [auth]
      security: [{csrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/password/reset:
    post:
      operationId: resetPassword
      summary: Set a new password with a reset token; revokes all sessions and refresh tokens
      tags: [auth]
      security: [{csrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string, maxLength: 128 }
                password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/tokens:
    post:
      operationId: issueTokens
      summary: Exchange credentials for an access + refresh token pair (API clients; no cookies, no CSRF)
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201': { $ref: '#/components/responses/TokenPair' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/tokens/refresh:
    post:
      operationId: refreshTokens
      summary: Rotate a refresh token; reusing an old one revokes the whole token family
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200': { $ref: '#/components/responses/TokenPair' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/tokens/revoke:
    post:
      operationId: revokeTokens
      summary: Revoke a refresh token family (always 204)
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Revoked (or unknown token) }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /tenants:
    get:
      operationId: listTenants
      summary: Organizations (tenants) the caller belongs to; `active` marks the session/token tenant
      tags: [tenants]
      security: [{sessionCookie: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Memberships
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Tenant' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/switch:
    post:
      operationId: switchTenant
      summary: Make another organization the active tenant of the browser session (404 if not a member)
      tags: [tenants]
      security: [{sessionCookie: [], csrfToken: []}]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200':
          description: Active tenant changed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /workspaces:
    get:
      operationId: listWorkspaces
      summary: Workspaces visible in the active tenant (own; whole tenant for org_admin)
      tags: [workspaces]
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: q, in: query, description: Name contains (literal match), schema: { type: string, maxLength: 80 } }
        - { name: sort, in: query, schema: { type: string, enum: [name, created_at, updated_at], default: created_at } }
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: Page of workspaces (meta has page, per_page, total, total_pages)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Workspace' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: createWorkspace
      summary: Create a workspace owned by the caller in the active tenant (tenant is never taken from the body)
      tags: [workspaces]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /workspaces/{workspace_id}:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: getWorkspace
      summary: Workspace details (404 when it does not exist or is not visible)
      tags: [workspaces]
      security: [{sessionCookie: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Workspace
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateWorkspace
      summary: Rename or change the description (owner or org_admin)
      tags: [workspaces]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                description: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteWorkspace
      summary: Delete the workspace and all its resources (soft delete; owner or org_admin)
      tags: [workspaces]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /workspaces/{workspace_id}/resources:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: listResources
      summary: Non-deleted resources of a workspace
      tags: [resources]
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ResourceType' } }
      responses:
        '200':
          description: Resources
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Resource' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: createResource
      summary: Create a storage account or lakehouse (simulated provisioning → active)
      description: Other types (dataset, pipeline, notebook, dashboard) are created by their own modules and return 422 here.
      tags: [resources]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, name]
              properties:
                type: { $ref: '#/components/schemas/ResourceType' }
                name: { type: string, minLength: 2, maxLength: 80 }
                region: { type: string, enum: [edu-local-1, edu-local-2], default: edu-local-1 }
                config: { $ref: '#/components/schemas/ResourceConfig' }
                tags: { $ref: '#/components/schemas/Tags' }
      responses:
        '201':
          description: Created (status active)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Resource' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /resources/{resource_id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: getResource
      summary: Resource details (404 when not visible)
      tags: [resources]
      security: [{sessionCookie: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Resource
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Resource' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateResource
      summary: Rename, change config (partial, allowlisted keys) or replace tags; only active resources
      tags: [resources]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                config: { $ref: '#/components/schemas/ResourceConfig' }
                tags: { $ref: '#/components/schemas/Tags' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Resource' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteResource
      summary: Delete through the lifecycle (active|failed → deleting → deleted)
      tags: [resources]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /workspaces/{workspace_id}/datasets:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: listDatasets
      summary: Datasets of a workspace (raw files and lakehouse tables), latest version each
      tags: [datasets]
      security: [{sessionCookie: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Datasets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Dataset' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: uploadDataset
      summary: Upload a CSV as a raw dataset; a profile job discovers schema, row count and preview
      description: |
        Validation: .csv only, up to quotas.upload_max_bytes (20 MB), text content (finfo + binary signature check),
        UTF-8, no NUL bytes; structural CSV validation (strict) happens in the runner. The file is stored outside the
        web root under a generated key; the client file name is display-only.
      tags: [datasets]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, file]
              properties:
                name: { type: string, pattern: '^[a-z][a-z0-9_]{0,62}$' }
                file: { type: string, format: binary }
                csrf_token: { type: string, description: Alternative to the X-CSRF-Token header }
      responses:
        '202':
          description: Accepted; a job was queued (poll GET /jobs/{job_id} or GET /datasets/{dataset_id})
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          dataset: { $ref: '#/components/schemas/Dataset' }
                          job: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /datasets/{dataset_id}:
    parameters: [{ $ref: '#/components/parameters/DatasetId' }]
    get:
      operationId: getDataset
      summary: Dataset with its latest version, schema and error (if processing failed)
      tags: [datasets]
      security: [{sessionCookie: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Dataset
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Dataset' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteDataset
      summary: Delete a dataset (active|failed → deleting); a cleanup job removes its file or drops its table
      tags: [datasets]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      responses:
        '202':
          description: Cleanup job queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: object, properties: { job: { $ref: '#/components/schemas/Job' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /datasets/{dataset_id}/preview:
    parameters: [{ $ref: '#/components/parameters/DatasetId' }]
    get:
      operationId: previewDataset
      summary: First rows (up to 50) captured when the dataset was processed
      tags: [datasets]
      security: [{sessionCookie: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Preview
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          columns: { type: array, items: { type: string } }
                          rows: { type: array, items: { type: array, items: {} } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /datasets/{dataset_id}/ingest:
    parameters: [{ $ref: '#/components/parameters/DatasetId' }]
    post:
      operationId: ingestDataset
      summary: Ingest a ready raw dataset into bronze.<table_name> of the workspace lakehouse
      description: Requires an active lakehouse resource in the workspace (409 LAKEHOUSE_REQUIRED). Column names are normalised to snake_case.
      tags: [datasets]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [table_name]
              properties:
                table_name: { type: string, pattern: '^[a-z][a-z0-9_]{0,62}$' }
      responses:
        '202':
          description: Accepted; a job was queued (poll GET /jobs/{job_id} or GET /datasets/{dataset_id})
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          dataset: { $ref: '#/components/schemas/Dataset' }
                          job: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /jobs/{job_id}:
    parameters: [{ name: job_id, in: path, required: true, schema: { type: string, description: ULID } }]
    get:
      operationId: getJob
      summary: Execution job status (visible to its creator, or org_admin)
      tags: [jobs]
      security: [{sessionCookie: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /workspaces/{workspace_id}/queries:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      operationId: runQuery
      summary: Run a read-only SELECT against the workspace lakehouse (async; poll GET /queries/{query_id})
      description: |
        Executed only in the execution-plane sandbox: exactly one SELECT (WITH/FROM/VALUES/DESCRIBE allowed),
        read-only DuckDB connection without file access, functions exposing server internals blocked,
        10 s timeout, up to 1000 rows / 1.5 MB. Requires an active lakehouse resource (409 LAKEHOUSE_REQUIRED).
      tags: [sql]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sql]
              properties:
                sql: { type: string, maxLength: 20000 }
      responses:
        '202':
          description: Query queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Query' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    get:
      operationId: queryHistory
      summary: The caller's query history in this workspace (newest first)
      tags: [sql]
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        '200':
          description: History page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Query' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /queries/{query_id}:
    parameters: [{ name: query_id, in: path, required: true, schema: { type: string, description: ULID } }]
    get:
      operationId: getQuery
      summary: Query status and, once succeeded, its result (kept 24 h)
      tags: [sql]
      security: [{sessionCookie: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Query
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Query' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /workspaces/{workspace_id}/catalog:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: lakehouseCatalog
      summary: Ready lakehouse tables per layer with their columns (from metadata)
      tags: [sql]
      security: [{sessionCookie: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Catalog
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: 
                        type: object
                        properties:
                          bronze: { type: array, items: { $ref: '#/components/schemas/CatalogTable' } }
                          silver: { type: array, items: { $ref: '#/components/schemas/CatalogTable' } }
                          gold: { type: array, items: { $ref: '#/components/schemas/CatalogTable' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /workspaces/{workspace_id}/transforms:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      operationId: createTransform
      summary: Materialise a SELECT as silver.<table> or gold.<table> (CREATE TABLE ... AS SELECT, async)
      tags: [sql]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sql, layer, table]
              properties:
                sql: { type: string, maxLength: 20000 }
                layer: { type: string, enum: [silver, gold] }
                table: { type: string, pattern: '^[a-z][a-z0-9_]{0,62}$' }
      responses:
        '202':
          description: Transform queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: 
                        type: object
                        properties:
                          dataset: { $ref: '#/components/schemas/Dataset' }
                          job: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /courses:
    get:
      operationId: listCourses
      summary: Courses of the active tenant visible to the caller (taught, enrolled, or all for org_admin)
      tags: [courses]
      security: [{sessionCookie: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Courses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Course' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createCourse
      summary: Create a course (draft) in the active organization (permission assign; 409 ORGANIZATION_REQUIRED in personal tenants)
      tags: [courses]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, title]
              properties:
                code: { type: string, pattern: '^[A-Z0-9][A-Z0-9-]{1,29}$', description: unique per organization }
                title: { type: string, minLength: 3, maxLength: 150 }
                description: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '201': { $ref: '#/components/responses/Course' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /courses/join:
    post:
      operationId: joinCourse
      summary: Join a course with its code (from any tenant); creates the student membership and enrollment
      description: |
        Returns the course and its organization; browser clients then switch to that tenant. An existing membership
        role is never changed. Invalid, rotated, disabled or archived codes all return the same 422.
        Rate-limited per IP (`course_join_ip`) and per user (`course_join_user`, 10 per 15 min) → 429.
      tags: [courses]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, maxLength: 20, example: ABCDE-23456, description: case and separators are ignored }
      responses:
        '200':
          description: Enrolled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          course: { type: object, properties: { id: { type: string }, title: { type: string } } }
                          tenant: { type: object, properties: { id: { type: string }, name: { type: string } } }
                          already_enrolled: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /courses/{course_id}:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    get:
      operationId: getCourse
      summary: Course with its assigned labs
      tags: [courses]
      security: [{sessionCookie: []}, {bearerAuth: []}]
      responses:
        '200': { $ref: '#/components/responses/Course' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateCourse
      summary: Update title, description or status (draft → published → archived ⇄ published); staff only
      tags: [courses]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                title: { type: string, minLength: 3, maxLength: 150 }
                description: { type: [string, 'null'], maxLength: 2000 }
                status: { type: string, enum: [draft, published, archived] }
      responses:
        '200': { $ref: '#/components/responses/Course' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /courses/{course_id}/join-code:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    post:
      operationId: rotateCourseJoinCode
      summary: Generate a new join code (published courses). Returned once; only its hash is stored; the previous code stops working.
      tags: [courses]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      responses:
        '201':
          description: New code
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: object, properties: { join_code: { type: string, example: ABCDE-23456 } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: disableCourseJoinCode
      summary: Disable joining
      tags: [courses]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      responses:
        '204': { description: Disabled }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /courses/{course_id}/labs:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    post:
      operationId: assignCourseLab
      summary: Assign a published lab to the course
      tags: [courses]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lab_code]
              properties:
                lab_code: { type: string, pattern: '^LAB-[0-9]{3}$' }
                required: { type: boolean, default: true }
                due_at: { type: [string, 'null'], format: date, description: 'due at 23:59:59 UTC of that day' }
      responses:
        '201': { $ref: '#/components/responses/Course' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /courses/{course_id}/labs/{lab_code}:
    parameters:
      - { $ref: '#/components/parameters/CourseId' }
      - { name: lab_code, in: path, required: true, schema: { type: string, pattern: '^LAB-[0-9]{3}$' } }
    delete:
      operationId: unassignCourseLab
      summary: Remove a lab from the course (attempts are kept)
      tags: [courses]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /courses/{course_id}/progress:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    get:
      operationId: courseProgress
      summary: Instructor grid - active students × assigned labs, best course attempt per cell (staff with review permission)
      tags: [courses]
      security: [{sessionCookie: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Progress
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          course: { $ref: '#/components/schemas/Course' }
                          labs: { type: array, items: { $ref: '#/components/schemas/CourseLab' } }
                          students:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: string }
                                display_name: { type: string }
                                labs:
                                  type: object
                                  description: lab code → best attempt (null when not started)
                                  additionalProperties:
                                    type: [object, 'null']
                                    properties:
                                      attempt_id: { type: string, description: 'open with GET /lab-attempts/{attempt_id} (read-only review)' }
                                      status: { type: string }
                                      best_score: { type: number }
                                      max_score: { type: number }
                                      submissions: { type: integer }
                                      failed_tasks: { type: [integer, 'null'] }
                                      completed_at: { type: [string, 'null'], format: date-time }
                                      last_submitted_at: { type: [string, 'null'], format: date-time }
                          summary:
                            type: object
                            additionalProperties:
                              type: object
                              properties:
                                started: { type: integer }
                                completed: { type: integer }
                                average_best_score: { type: [number, 'null'] }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /labs:
    get:
      operationId: listLabs
      summary: Published labs with the caller's attempt summary (no checks, expected SQL or solutions)
      tags: [labs]
      security: [{sessionCookie: []}, {bearerAuth: []}]
      responses:
        '200':
          description: Lab catalog
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/LabSummary' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /lab-attempts:
    post:
      operationId: startLab
      summary: Start a lab (creates a dedicated lab workspace and runs its setup) or return the open attempt
      description: |
        201 with a new attempt, or 200 with the caller's attempt that is still open for that lab.
        Setup jobs (sample loading) run asynchronously: `environment.ready` turns true when they finish.
        Lab workspaces do not count towards the workspace quota; at most `quotas.active_lab_attempts_per_user`
        attempts can be in progress (409 QUOTA_EXCEEDED).
      tags: [labs]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lab_code]
              properties:
                lab_code: { type: string, pattern: '^LAB-[0-9]{3}$' }
                course_id: { type: [string, 'null'], description: 'course context (must be enrolled and the lab assigned); when omitted, the only course of the active tenant that assigns the lab is used' }
      responses:
        '200': { $ref: '#/components/responses/LabAttempt' }
        '201': { $ref: '#/components/responses/LabAttempt' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /lab-attempts/{attempt_id}:
    parameters: [{ $ref: '#/components/parameters/AttemptId' }]
    get:
      operationId: getLabAttempt
      summary: Attempt state, tasks, revealed hints, saved answers and the latest graded results
      description: Visible to its owner and, read-only, to tenant-wide roles (org_admin) and to the staff of the attempt's course. Others get 404.
      tags: [labs]
      security: [{sessionCookie: []}, {bearerAuth: []}]
      responses:
        '200': { $ref: '#/components/responses/LabAttempt' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: abandonLabAttempt
      summary: Abandon the attempt and release its lab workspace (a completed attempt keeps its best score)
      tags: [labs]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      responses:
        '204': { description: Abandoned }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /lab-attempts/{attempt_id}/hints:
    parameters: [{ $ref: '#/components/parameters/AttemptId' }]
    post:
      operationId: revealLabHint
      summary: Reveal a hint (in order). Its penalty is recorded once and applied when the task passes.
      tags: [labs]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [task_key, hint_index]
              properties:
                task_key: { type: string, pattern: '^[a-z][a-z0-9_]{0,39}$' }
                hint_index: { type: integer, minimum: 0 }
      responses:
        '200':
          description: The hint
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          task_key: { type: string }
                          index: { type: integer }
                          text: { type: string }
                          penalty: { type: integer }
                          newly_revealed: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /lab-attempts/{attempt_id}/answers:
    parameters: [{ $ref: '#/components/parameters/AttemptId' }]
    post:
      operationId: saveLabAnswer
      summary: Save the SQL answer of an exercise task (re-executed in the sandbox when the attempt is validated)
      tags: [labs]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [task_key, sql]
              properties:
                task_key: { type: string, pattern: '^[a-z][a-z0-9_]{0,39}$' }
                sql: { type: string, maxLength: 20000 }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: object, properties: { task_key: { type: string }, sql: { type: string } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /lab-attempts/{attempt_id}/submit:
    parameters: [{ $ref: '#/components/parameters/AttemptId' }]
    post:
      operationId: submitLabAttempt
      summary: Grade the attempt from the actual state of its workspace (async; poll GET /lab-attempts/{attempt_id})
      description: |
        The body must be empty (`{}`): results, scores or flags sent by a client are rejected (422) - grading is
        done only by the server. 409 ATTEMPT_VALIDATING while a validation is running; 409 ATTEMPT_CLOSED when
        the attempt was abandoned or expired.
      tags: [labs]
      security: [{sessionCookie: [], csrfToken: []}, {bearerAuth: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        '202': { $ref: '#/components/responses/LabAttempt' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
components:
  parameters:
    CourseId: { name: course_id, in: path, required: true, schema: { type: string, description: ULID of the course } }
    AttemptId: { name: attempt_id, in: path, required: true, schema: { type: string, description: ULID of the lab attempt } }
    TenantId: { name: tenant_id, in: path, required: true, schema: { type: string, description: ULID } }
    WorkspaceId: { name: workspace_id, in: path, required: true, schema: { type: string, description: ULID } }
    ResourceId: { name: resource_id, in: path, required: true, schema: { type: string, description: ULID } }
    DatasetId: { name: dataset_id, in: path, required: true, schema: { type: string, description: ULID of the dataset resource } }
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: ecsid }
    csrfToken: { type: apiKey, in: header, name: X-CSRF-Token }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Course:
      type: object
      properties:
        id: { type: string, description: ULID }
        code: { type: string }
        title: { type: string }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [draft, published, archived] }
        owner: { type: object, properties: { id: { type: string }, display_name: { type: string } } }
        my_role: { type: string, enum: [staff, student] }
        can_manage: { type: boolean }
        student_count: { type: [integer, 'null'], description: staff only }
        lab_count: { type: integer }
        join_enabled: { type: [boolean, 'null'], description: staff only }
        labs: { type: array, items: { $ref: '#/components/schemas/CourseLab' }, description: single-course responses only }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CourseLab:
      type: object
      properties:
        code: { type: string }
        title: { type: string }
        difficulty: { type: string }
        estimated_minutes: { type: integer }
        max_score: { type: number }
        required: { type: boolean }
        due_at: { type: [string, 'null'], format: date-time }
    LabSummary:
      type: object
      properties:
        code: { type: string, example: LAB-004 }
        version: { type: string }
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        difficulty: { type: string, enum: [beginner, intermediate, advanced] }
        estimated_minutes: { type: integer }
        max_score: { type: integer }
        objectives: { type: array, items: { type: string } }
        prerequisites: { type: array, items: { type: string } }
        downloads: { type: array, items: { type: object, properties: { name: { type: string }, url: { type: string } } } }
        task_count: { type: integer }
        my_attempt:
          type: [object, 'null']
          properties:
            id: { type: string }
            status: { type: string, enum: [in_progress, validating, completed, abandoned, expired] }
            open: { type: boolean, description: the attempt still has a usable lab workspace }
            best_score: { type: number }
    LabAttempt:
      type: object
      properties:
        id: { type: string, description: ULID }
        status: { type: string, enum: [in_progress, validating, completed, abandoned, expired] }
        score: { type: number, description: score of the latest graded submission }
        best_score: { type: number }
        max_score: { type: number }
        hints_used: { type: integer }
        submissions: { type: integer }
        is_owner: { type: boolean }
        student: { type: object, properties: { id: { type: string }, display_name: { type: string } } }
        course: { type: [object, 'null'], properties: { id: { type: string }, title: { type: string } } }
        error: { type: [object, 'null'], description: last validation failure (e.g. TIMEOUT), properties: { code: { type: string }, message: { type: string } } }
        lab: { $ref: '#/components/schemas/LabSummary' }
        workspace:
          type: [object, 'null']
          properties:
            id: { type: string }
            status: { type: string, enum: [active, deleting, deleted] }
            expires_at: { type: [string, 'null'], format: date-time, description: extended on every answer/submission }
        environment:
          type: object
          properties:
            ready: { type: boolean, description: setup jobs finished }
            pending_jobs: { type: integer }
        tasks:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              title: { type: string }
              points: { type: integer }
              instructions_md: { type: string, description: CommonMark (render with raw HTML escaped) }
              answer: { type: boolean, description: the task is graded from a saved SQL answer }
              answer_sql: { type: [string, 'null'] }
              hints:
                type: array
                items:
                  type: object
                  properties:
                    index: { type: integer }
                    penalty: { type: integer }
                    text: { type: [string, 'null'], description: null until revealed }
              result:
                type: [object, 'null']
                properties:
                  passed: { type: boolean }
                  points: { type: number }
                  feedback: { type: [string, 'null'] }
        started_at: { type: string, format: date-time }
        last_submitted_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
    Query:
      type: object
      properties:
        id: { type: string, description: ULID }
        workspace_id: { type: string }
        sql: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, timed_out, cancelled] }
        duration_ms: { type: [integer, 'null'] }
        row_count: { type: [integer, 'null'] }
        error: { type: [object, 'null'], properties: { code: { type: string }, message: { type: string } } }
        created_at: { type: string, format: date-time }
        result:
          type: [object, 'null']
          description: present when status is succeeded (GET /queries/{query_id} only)
          properties:
            columns: { type: array, items: { type: object, properties: { name: { type: string }, type: { type: string } } } }
            rows: { type: array, items: { type: array, items: {} } }
            truncated: { type: boolean }
        result_expired: { type: boolean }
    CatalogTable:
      type: object
      properties:
        dataset_id: { type: string }
        table: { type: string }
        qualified_name: { type: string, example: bronze.customers }
        row_count: { type: [integer, 'null'] }
        columns: { type: array, items: { type: object, properties: { name: { type: string }, type: { type: string } } } }
    Dataset:
      type: object
      properties:
        id: { type: string, description: ULID }
        workspace_id: { type: string }
        name: { type: string }
        layer: { type: string, enum: [raw, bronze, silver, gold] }
        table: { type: [string, 'null'], description: '<layer>.<table> for lakehouse tables; null for raw files' }
        status: { type: string, enum: [provisioning, active, failed, deleting] }
        version:
          type: [object, 'null']
          properties:
            id: { type: string }
            number: { type: integer }
            format: { type: string, enum: [csv, json, parquet, table] }
            original_name: { type: [string, 'null'] }
            bytes: { type: integer }
            row_count: { type: [integer, 'null'] }
            column_count: { type: [integer, 'null'] }
            status: { type: string, enum: [pending, processing, ready, failed] }
        columns:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              type: { type: string }
              suggested_name: { type: string, description: raw only - normalised name used on ingestion }
              source_name: { type: string, description: tables only - original CSV header }
        error: { type: [object, 'null'], properties: { code: { type: string }, message: { type: string } } }
        sql: { type: [string, 'null'], description: defining SELECT of silver/gold tables created by transforms }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Job:
      type: object
      properties:
        id: { type: string, description: ULID }
        type: { type: string, enum: [profile, ingest, cleanup, sql_query, transform, validate, pipeline_run] }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled, timed_out] }
        workspace_id: { type: [string, 'null'] }
        error: { type: [object, 'null'], properties: { code: { type: string }, message: { type: string } } }
        result: { type: [object, 'null'] }
        queued_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    Tenant:
      type: object
      properties:
        id: { type: string, description: ULID }
        name: { type: string }
        type: { type: string, enum: [personal, organization] }
        role: { type: string, enum: [org_admin, instructor, student, read_only] }
        active: { type: boolean }
    WorkspaceInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 80, pattern: '^[\\p{L}\\p{N}][\\p{L}\\p{N} ._-]*$' }
        description: { type: string, maxLength: 500 }
    Workspace:
      type: object
      properties:
        id: { type: string, description: ULID }
        name: { type: string }
        description: { type: [string, 'null'] }
        purpose: { type: string, enum: [general, lab], description: lab workspaces belong to a lab attempt and cannot be deleted directly (409 LAB_WORKSPACE) }
        status: { type: string, enum: [active, deleting, deleted] }
        expires_at: { type: [string, 'null'], format: date-time, description: lab workspaces only (inactivity TTL) }
        owner: { type: object, properties: { id: { type: string }, display_name: { type: string } } }
        resource_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ResourceType:
      type: string
      enum: [storage, lakehouse, dataset, pipeline, notebook, dashboard]
    ResourceConfig:
      type: object
      description: |
        Allowlisted per type. storage: access_tier (hot|cool|archive), versioning (bool), redundancy (lrs|zrs).
        lakehouse: default_layer (bronze|silver|gold). Unknown keys → 422.
    Tags:
      type: object
      maxProperties: 10
      propertyNames: { pattern: '^[a-z0-9_-]{1,32}$' }
      additionalProperties: { type: string, maxLength: 64 }
    Resource:
      type: object
      properties:
        id: { type: string, description: ULID }
        workspace_id: { type: string }
        type: { $ref: '#/components/schemas/ResourceType' }
        name: { type: string }
        status: { type: string, enum: [provisioning, active, failed, deleting, deleted] }
        region: { type: string }
        config: { $ref: '#/components/schemas/ResourceConfig' }
        tags: { $ref: '#/components/schemas/Tags' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, maxLength: 1024 }
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, maxLength: 128 }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: { type: string, maxLength: 128 }
    User:
      type: object
      properties:
        id: { type: string, description: ULID }
        email: { type: string }
        display_name: { type: string }
        is_platform_admin: { type: boolean }
        locale: { type: string }
    TenantMembership:
      type: object
      properties:
        id: { type: string, description: Tenant ULID (active tenant) }
        tenant_id: { type: string, description: Tenant ULID (memberships list) }
        name: { type: string }
        type: { type: string, enum: [personal, organization] }
        role: { type: string, enum: [org_admin, instructor, student, read_only] }
    Meta:
      type: object
      properties:
        request_id: { type: string, pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: {}
        message: { type: string }
        meta: { $ref: '#/components/schemas/Meta' }
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED, CONFLICT,
                     QUOTA_EXCEEDED, PAYLOAD_TOO_LARGE, RATE_LIMITED, SERVICE_UNAVAILABLE, INTERNAL_ERROR,
                     CSRF_INVALID, INVALID_CREDENTIALS, EMAIL_NOT_VERIFIED, ACCOUNT_DISABLED, TOKEN_INVALID,
                     INVALID_STATE, MANAGED_RESOURCE, LAKEHOUSE_REQUIRED, UPLOAD_FAILED]
            message: { type: string }
            details:
              type: array
              items:
                type: object
                required: [code, message]
                properties:
                  field: { type: string }
                  code: { type: string }
                  message: { type: string }
        meta: { $ref: '#/components/schemas/Meta' }
  responses:
    Course:
      description: Course
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Course' }
    LabAttempt:
      description: Lab attempt
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/LabAttempt' }
    Ok:
      description: Success envelope with a message
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    Accepted:
      description: Accepted; the same generic message is returned whether or not the account exists
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    TokenPair:
      description: Access and refresh tokens
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      token_type: { type: string, const: Bearer }
                      access_token: { type: string }
                      expires_in: { type: integer }
                      refresh_token: { type: string }
                      refresh_expires_in: { type: integer }
    Error:
      description: Error envelope (never contains stack traces, SQL or paths)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
